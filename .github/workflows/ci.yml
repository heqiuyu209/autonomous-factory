name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev/llm extras
        run: python -m pip install -e ".[dev,llm]"

      - name: Lint (deterministic gate config)
        run: python -m ruff check factory tests

      - name: Test suite (with coverage)
        run: python -m pytest --cov=factory --cov-report=term-missing -q
